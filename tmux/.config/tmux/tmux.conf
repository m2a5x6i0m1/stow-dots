# TODO: Plugins
# - Floax
# - SessionX / Sesh
# - tmux-thumbs
# - tmux-notify

# Must have
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g set-clipboard on
set -g focus-events on
set -g mouse on
set -g status-position top


# Leader
unbind C-b; set -g prefix M-Space

# Hot reload
unbind r
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# No confirm kill pane
bind-key x kill-pane

# New window in current path
bind-key c new-window -c "#{pane_current_path}"

# Somewhat sensible splits
unbind %
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Better windows
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Pane resizing
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Sensible window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim style copy
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Superior pane navigation
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"
set -g @vim_navigator_mapping_prev ""

# Colorscheme X statusbar
set -g @plugin 'catppuccin/tmux#v2.3.0'
# set -g @catppuccin_window_current_text " #W"
# set -g @catppuccin_window_text " #W"

# Status modules theming
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""

set -g status-interval 1
set -g status-right-length 100
set -g status-left-length 100

set -g status-right ""
set -g status-left ""
# set -ag status-right "#{E:@catppuccin_status_directory}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
# set -ag status-right "#{E:@catppuccin_status_application}"
# set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Use this for floating pills statusline if you don't need transparency support
# set -g @catppuccin_window_status_style "rounded"
# set -g @catppuccin_status_background "#{@thm_bg}"

# Dirty fix for catppuccin rounded windows not working well with transparency
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_overlay_2}]#[bg=#{@thm_overlay_2},fg=#{@thm_surface_0}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_overlay_2}]█"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"

# Icons for window status
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_last "" # -
set -g @catppuccin_window_flags_icon_current "" # *
set -g @catppuccin_window_flags_icon_zoom " 󰁌 " # Z
set -g @catppuccin_window_flags_icon_mark " 󰃀 " # M
set -g @catppuccin_window_flags_icon_silent " 󰂛 " # ~
set -g @catppuccin_window_flags_icon_activity " 󱅫 " # #
set -g @catppuccin_window_flags_icon_bell " 󰂞 " # !

# Matches icon order when using `#F` (`#!~[*-]MZ`), I've deleted whitespace at the end and moved it into options above, so it's not rendered when there is no icons
set -g @catppuccin_window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},}"

# Just a bunch of fancy shit
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# Bootstrap tpm
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# Initialize tpm
run '~/.local/share/tmux/plugins/tpm/tpm'
