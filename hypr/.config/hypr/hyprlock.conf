source = $HOME/.config/hypr/modules/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = CodeNewRoman Nerd Font

general {
  immediate_render = false
  disable_loading_bar = true
  fail_timeout = 1500
  hide_cursor = false
}

background {
  path = screenshot
  blur_passes = 2
  blur_size = 3
  brightness = 0.6
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%R")"
  color = $text
  font_size = 65
  font_family = $font
  position = -10, 5
  halign = right
  valign = top
}

# DATE 
label {
  monitor = 
  text = cmd[update:43200000] echo "$(date +"%d %B %Y")"
  color = $text
  font_size = 18
  font_family = $font
  position = -20, -78
  halign = right
  valign = top
}

# USER AVATAR
image {
  monitor = 
  path = ~/.face.jpg
  size = 250
  border_color = $accent
  border_size = 2

  position = 0, 110
  halign = center
  valign = center
  zindex = 2
}

# USER NAME
label {
  monitor = 
  text =$USER
  color = $text
  font_size = 28
  font_family = $font
  position = 0, -95
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  rounding = 7
  size = 250, 8%
  outline_thickness = 2
  dots_size = 0.24
  dots_spacing = 0.24
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = false
  placeholder_text = 
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = fail
  capslock_color = $yellow
  position = 0, -175
  halign = center
  valign = center
}
